<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crosschq Interview Report Widget — Demo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./crosschq-widget.css">
  <style>
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #111;
    }
    .demo-header {
      padding: 16px 24px;
      background: #303546;
      color: #fff;
    }
    .demo-header h1 { margin: 0 0 4px; font-size: 18px; }
    .demo-header p { margin: 0; font-size: 13px; opacity: 0.7; }
    .demo-form {
      padding: 16px 24px;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 1200px;
    }
    .demo-form label {
      font-size: 12px;
      font-weight: 500;
      color: #555;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .demo-form label.full { grid-column: 1 / -1; }
    .demo-form input {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
    }
    .demo-form button {
      grid-column: 1 / -1;
      padding: 10px 16px;
      background: #303546;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      justify-self: start;
    }
    .demo-form button:hover { background: #4a5168; }
    .demo-form button:disabled { opacity: 0.5; cursor: not-allowed; }
    .demo-error {
      grid-column: 1 / -1;
      padding: 8px 12px;
      background: #fee;
      border: 1px solid #fcc;
      border-radius: 4px;
      color: #900;
      font-size: 13px;
    }
    .demo-results-container {
      padding: 24px;
      max-width: 1200px;
    }
    .demo-empty {
      padding: 64px 24px;
      text-align: center;
      color: #888;
      font-size: 14px;
    }
    .cq-viewport-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 24px;
      background: #fafafa;
      border-bottom: 1px solid #e5e5e5;
      font-size: 13px;
    }
    .cq-viewport-label {
      color: #555;
      font-weight: 500;
      margin-right: 4px;
    }
    .cq-vp-chip {
      padding: 4px 10px;
      border: 1px solid #ccc;
      background: #fff;
      color: #333;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }
    .cq-vp-chip:hover { border-color: #303546; }
    .cq-vp-chip.active {
      background: #303546;
      color: #fff;
      border-color: #303546;
    }
    .cq-viewport-frame {
      display: flex;
      justify-content: center;
    }
    .cq-viewport-frame > .cq-viewport-inner {
      width: 100%;
      max-width: 1200px;
    }
    .cq-viewport-frame[data-width="360"] > .cq-viewport-inner { width: 360px; }
    .cq-viewport-frame[data-width="420"] > .cq-viewport-inner { width: 420px; }
    .cq-viewport-frame[data-width="600"] > .cq-viewport-inner { width: 600px; }
    .cq-viewport-frame[data-width="360"] > .cq-viewport-inner,
    .cq-viewport-frame[data-width="420"] > .cq-viewport-inner,
    .cq-viewport-frame[data-width="600"] > .cq-viewport-inner {
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }
    .cq-viewport-frame[data-width="full"] > .cq-viewport-inner {
      max-width: 1200px;
    }
    .demo-mode-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 24px;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      font-size: 13px;
    }
    .demo-mode-label { color: #555; font-weight: 500; margin-right: 4px; }
    .demo-mode-btn {
      padding: 4px 10px;
      border: 1px solid #ccc;
      background: #fff;
      color: #333;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }
    .demo-mode-btn.active {
      background: #303546;
      color: #fff;
      border-color: #303546;
    }
    .demo-mode-help {
      margin-left: 8px;
      color: #888;
      font-size: 12px;
    }
    .demo-form textarea {
      grid-column: 1 / -1;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      min-height: 140px;
      resize: vertical;
    }
    .demo-form[data-mode="push"] .pull-only,
    .demo-form[data-mode="pull"] .push-only {
      display: none;
    }
  </style>
</head>
<body>
  <header class="demo-header">
    <h1>Crosschq Interview Report Widget</h1>
    <p>Standalone demo — paste an interview ID, API host, and JWT to render the embedded report.</p>
  </header>

  <div class="demo-mode-toolbar">
    <span class="demo-mode-label">Mode:</span>
    <button type="button" id="mode-push" class="demo-mode-btn active">Push (data)</button>
    <button type="button" id="mode-pull" class="demo-mode-btn">Pull (fetch)</button>
    <span class="demo-mode-help" id="mode-help">Paste a pre-fetched report JSON below.</span>
    <button type="button" id="load-sample" class="demo-mode-btn" style="margin-left: auto;">Load sample data</button>
  </div>

  <form id="demo-form" class="demo-form" data-mode="push" onsubmit="return false;">
    <label class="full">
      Interview ID (UUID)
      <input id="f-interview-id" type="text" placeholder="4032b4be-f3f6-4cba-a727-c37c89407834" required>
    </label>
    <label class="full push-only">
      Report JSON (push mode — paste the full payload here)
      <textarea id="f-report-data" placeholder='{ "report_data": { "sections": [ ... ] }, "completed_at": "..." }'></textarea>
    </label>
    <label class="full push-only">
      Transcription JSON (push mode — optional; enables the Video &amp; Transcript tab)
      <textarea id="f-transcription-data" placeholder='{ "interview_type": "ai", "transcription": [ ... ], "recording_urls": [ ... ] }'></textarea>
    </label>
    <label class="pull-only">
      API Host
      <input id="f-api-host" type="url" value="https://interview.crosschq.dev/api/">
    </label>
    <label class="pull-only">
      Bearer Token (JWT)
      <input id="f-bearer-token" type="text" placeholder="eyJ...">
    </label>
    <div id="demo-error" class="demo-error" style="display: none;"></div>
    <button id="f-submit" type="submit">Render report</button>
  </form>

  <div class="cq-viewport-toolbar" id="cq-viewport-toolbar">
    <span class="cq-viewport-label">Viewport:</span>
    <button type="button" class="cq-vp-chip" data-width="360">360px</button>
    <button type="button" class="cq-vp-chip" data-width="420">420px</button>
    <button type="button" class="cq-vp-chip" data-width="600">600px</button>
    <button type="button" class="cq-vp-chip active" data-width="full">Full</button>
    <span id="cq-viewport-status" style="margin-left: auto; color: #888; font-size: 12px;"></span>
  </div>

  <div class="demo-results-container">
    <div class="cq-viewport-frame" id="cq-viewport-frame" data-width="full">
      <div class="cq-viewport-inner">
        <div id="results">
          <div class="demo-empty">Fill the form and click Render report to load the widget.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="./crosschq-widget.umd.js"></script>
  <script>
    (function () {
      var btn = document.getElementById('f-submit');
      var errEl = document.getElementById('demo-error');
      var resultsEl = document.getElementById('results');
      var frameEl = document.getElementById('cq-viewport-frame');
      var statusEl = document.getElementById('cq-viewport-status');
      var chipEls = document.querySelectorAll('.cq-vp-chip');

      var STORAGE_KEY = 'crosschq-widget-demo:form';
      var VIEWPORT_KEY = 'crosschq-widget-demo:viewport';
      var MODE_KEY = 'crosschq-widget-demo:mode';
      var formEl = document.getElementById('demo-form');
      var modePushBtn = document.getElementById('mode-push');
      var modePullBtn = document.getElementById('mode-pull');
      var modeHelpEl = document.getElementById('mode-help');
      var reportDataEl = document.getElementById('f-report-data');
      var transcriptionDataEl = document.getElementById('f-transcription-data');

      try {
        var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        if (saved.interviewID) document.getElementById('f-interview-id').value = saved.interviewID;
        if (saved.apiHost) document.getElementById('f-api-host').value = saved.apiHost;
        if (saved.bearerToken) document.getElementById('f-bearer-token').value = saved.bearerToken;
        if (saved.reportData) reportDataEl.value = saved.reportData;
        if (saved.transcriptionData) transcriptionDataEl.value = saved.transcriptionData;
      } catch (e) { /* ignore */ }

      var savedViewport = 'full';
      try { savedViewport = sessionStorage.getItem(VIEWPORT_KEY) || 'full'; } catch (e) {}
      applyViewport(savedViewport, false);

      var savedMode = 'push';
      try { savedMode = sessionStorage.getItem(MODE_KEY) || 'push'; } catch (e) {}
      applyMode(savedMode);

      function applyMode(mode) {
        formEl.setAttribute('data-mode', mode);
        modePushBtn.classList.toggle('active', mode === 'push');
        modePullBtn.classList.toggle('active', mode === 'pull');
        modeHelpEl.textContent = mode === 'push'
          ? 'Paste a pre-fetched report JSON below.'
          : 'Widget fetches the report at runtime using the credentials below.';
        try { sessionStorage.setItem(MODE_KEY, mode); } catch (e) {}
      }
      modePushBtn.addEventListener('click', function () { applyMode('push'); });
      modePullBtn.addEventListener('click', function () { applyMode('pull'); });

      var loadSampleBtn = document.getElementById('load-sample');
      loadSampleBtn.addEventListener('click', function () {
        hideError();
        loadSampleBtn.disabled = true;
        loadSampleBtn.textContent = 'Loading…';
        Promise.all([
          fetch('./sample-report.json').then(function (r) {
            if (!r.ok) throw new Error('sample-report.json not found (HTTP ' + r.status + ')');
            return r.json();
          }),
          fetch('./sample-transcription.json')
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; }),
        ]).then(function (results) {
          var report = results[0];
          var transcription = results[1];
          applyMode('push');
          document.getElementById('f-interview-id').value =
            report.interview_id || report.id || 'sample-interview';
          reportDataEl.value = JSON.stringify(report, null, 2);
          transcriptionDataEl.value = transcription ? JSON.stringify(transcription, null, 2) : '';
          renderWidget();
        }).catch(function (e) {
          showError('Could not load sample data: ' + e.message);
        }).finally(function () {
          loadSampleBtn.disabled = false;
          loadSampleBtn.textContent = 'Load sample data';
        });
      });

      function applyViewport(width, reRender) {
        frameEl.setAttribute('data-width', width);
        chipEls.forEach(function (chip) {
          chip.classList.toggle('active', chip.getAttribute('data-width') === width);
        });
        statusEl.textContent = width === 'full' ? 'Full width' : 'Sidebar simulation @ ' + width + 'px';
        try { sessionStorage.setItem(VIEWPORT_KEY, width); } catch (e) {}
        if (reRender && handle) renderWidget();
      }

      chipEls.forEach(function (chip) {
        chip.addEventListener('click', function () {
          applyViewport(chip.getAttribute('data-width'), true);
        });
      });

      var handle = null;

      function currentMode() {
        return formEl.getAttribute('data-mode') || 'push';
      }

      function buildRenderOpts(mount) {
        var interviewID = document.getElementById('f-interview-id').value.trim();
        if (!interviewID) {
          showError('Interview ID is required.');
          return null;
        }
        var opts = { interviewID: interviewID, target: mount };
        if (currentMode() === 'push') {
          var raw = reportDataEl.value.trim();
          if (!raw) {
            showError('Push mode requires a JSON payload in the Report JSON field.');
            return null;
          }
          try {
            opts.reportData = JSON.parse(raw);
          } catch (e) {
            showError('Invalid JSON in Report JSON: ' + e.message);
            return null;
          }
          var rawTranscription = transcriptionDataEl.value.trim();
          if (rawTranscription) {
            try {
              opts.transcriptionData = JSON.parse(rawTranscription);
            } catch (e) {
              showError('Invalid JSON in Transcription JSON: ' + e.message);
              return null;
            }
          }
        } else {
          var apiHost = document.getElementById('f-api-host').value.trim();
          var bearerToken = document.getElementById('f-bearer-token').value.trim();
          if (!apiHost || !bearerToken) {
            showError('Pull mode requires both API Host and Bearer Token.');
            return null;
          }
          opts.apiHost = apiHost;
          opts.bearerToken = bearerToken;
        }
        return opts;
      }

      function renderWidget() {
        var mount = document.createElement('div');
        var opts = buildRenderOpts(mount);
        if (!opts) return;

        if (handle && typeof handle.destroy === 'function') {
          handle.destroy();
          handle = null;
        }
        clearResults();
        mount.id = 'cq-mount';
        resultsEl.appendChild(mount);
        try {
          handle = window.CrosschqWidget.render(opts);
        } catch (e) {
          showError('Render failed: ' + (e && e.message ? e.message : String(e)));
        }
      }

      function showError(msg) {
        errEl.textContent = msg;
        errEl.style.display = 'block';
      }
      function hideError() {
        errEl.textContent = '';
        errEl.style.display = 'none';
      }

      function clearResults() {
        while (resultsEl.firstChild) resultsEl.removeChild(resultsEl.firstChild);
      }

      btn.addEventListener('click', function () {
        hideError();
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            interviewID: document.getElementById('f-interview-id').value.trim(),
            apiHost: document.getElementById('f-api-host').value.trim(),
            bearerToken: document.getElementById('f-bearer-token').value.trim(),
            reportData: reportDataEl.value.trim(),
            transcriptionData: transcriptionDataEl.value.trim(),
          }));
        } catch (e) { /* ignore */ }

        renderWidget();
      });
    })();
  </script>
</body>
</html>
